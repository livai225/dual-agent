name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests (unitaires partout ; flux avec faux agents sous Linux/macOS)
        run: python -m unittest discover -s tests -v
      - name: Installation en paquet
        run: |
          python -m pip install .
          dual-agent --version
